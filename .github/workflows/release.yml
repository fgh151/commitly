  # ==================== WINDOWS BUILD ====================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows zip
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "commitly-windows-$version.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "$zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

  # ==================== MACOS BUILD ====================
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "Commitly" -srcfolder Commitly.app -format UDZO commitly.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/Build/Products/Release/commitly.dmg
          retention-days: 14

  # ==================== CREATE RELEASE ====================
  create-release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
#      - name: Download APK artifact
#        uses: actions/download-artifact@v4
#        with:
#          name: apk
#          path: artifacts/apk

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/windows

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.zip
            artifacts/macos/commitly.dmg
#            artifacts/apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
