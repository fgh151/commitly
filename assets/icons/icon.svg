<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Git branch nodes and connections -->
  <!-- Main vertical line -->
  <line x1="256" y1="120" x2="256" y2="392" stroke="white" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Left branch -->
  <line x1="256" y1="200" x2="160" y2="200" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <circle cx="160" cy="200" r="28" fill="white"/>
  <circle cx="160" cy="200" r="12" fill="#1a73e8"/>
  
  <!-- Right branch -->
  <line x1="256" y1="312" x2="352" y2="312" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <circle cx="352" cy="312" r="28" fill="white"/>
  <circle cx="352" cy="312" r="12" fill="#1a73e8"/>
  
  <!-- Top node -->
  <circle cx="256" cy="120" r="20" fill="white"/>
  
  <!-- Bottom node with checkmark -->
  <circle cx="256" cy="392" r="28" fill="white"/>
  <!-- Checkmark -->
  <path d="M242 392 L250 400 L270 380" stroke="#1a73e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
